<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site sobre elemento Iframe. Inline Frame para embutir outros sites.">
    <title>Sobre IFrames | HTML</title>
</head>

<body>
    <h1>Iframe</h1>
    <hr>

    <h2>Para que serve?</h2>
    <p> O Inline Frame é um elemento que nos permite embutir outro documento ou conteúdo externo dentro da nossa página. É bastante usada para YouTube, Google Maps, formulários externos, etc.</p>

    <h3>Exemplo básico de iframe</h3>
    <iframe src="04-imagens.html" frameborder="1"> </iframe>

    <h3>Carregando o YouTube</h3>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/i-ooK0d4iO4?si=UJ6zQTz7v2saNcnM" title="YouTube video player COM O VÍDEO SOBRE INGLÊS" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>

    </iframe>

    <h3>Carregando mapas</h3>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3657.1974904583717!2d-46.65906922627864!3d-23.561349561588735!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce59c8da0aa315%3A0xd59f9431f2c9776a!2sAv.%20Paulista%2C%20S%C3%A3o%20Paulo%20-%20SP!5e0!3m2!1spt-BR!2sbr!4v1790166605811!5m2!1spt-BR!2sbr" width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">

    </iframe>

    <h3>Carregando pdf</h3>

    <iframe src="ementa_ux_unicornio_2023.pdf" frameborder="1" width="600" height="500">

    </iframe>

</body>

</html>
