<!-- DOCTYPE - serve para indicar para os navegadores qual a versão e qual o padrão de HTML está sendo usado -->
<!DOCTYPE html>

<!-- HTML -  Elemento raiz. Tudo que pertence ao documento HTML fica dentro dele -->

<!-- LANG/language(idioma) = atributo responsável pela linguagem do conteúdo do site. Além disso, tem um impacto muito grande na acessibilidade e SEO -->
<html lang="pt-br">

<!-- HEAD(cabeça) = Funciona como o "cérebro" da página, dando instruções para navegadores e robôs de busca-->
<head>
    <!-- charset = essa configuração serve para indicar ao navegador qual padrão/codificação de caracteres usar. Isso permite, utilizar palavras com acentos, caracteres especiais e emojis. -->
    <meta charset="UTF-8">

    <!--  -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- title/título = Representa o título que aparece na aba do navegador para o usuário. -->
    <title>Olá Mundo</title>
</head>


<!-- body - conteúdo visível da página onde o usuário interage e consome recursos da página. Por exemplo: Títulos, parágrafos, imagens, vídeos, formulários e etc. -->
<body>
    Olá, Mundo. Este é o meu primeiro programa em HTML.
</body>

</html>
